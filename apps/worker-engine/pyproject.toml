[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tenant-shield-worker"
version = "0.1.0"
description = "The Tenant Shield execution engine — pulls specs from the queue, runs pytest/Playwright, streams results."
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Tenant Shield" }]
dependencies = [
    "tenacity>=8.2.0",
    "redis>=5.0.0",
    "httpx>=0.26.0",
    "playwright>=1.61.0",
    "pytest>=7.4.0",
    "tenant-shield-schema",
    "tenant-shield-utils",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.0"]

[tool.setuptools.packages.find]
where = ["src"]
