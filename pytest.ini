[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
timeout = 60
filterwarnings =
    ignore::DeprecationWarning
markers =
    integration: Integration tests spanning API and UI layers
    security: Security and tenant isolation tests
    mobile: Mobile device tests using BrowserStack
    smoke: Quick smoke tests for CI pipeline
    regression: Full regression suite
