[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "airlock-sandbox-isolation"
version = "0.1.0"
description = "Airlock no-retention primitive — tmpfs mounting, teardown proof, signed receipts. The architectural enforcement of the privacy guarantee."
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Airlock" }]
dependencies = [
    "pydantic>=2.5.0",
    "cryptography>=42.0.0",
    "tenant-shield-schema",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sandbox_isolation = ["py.typed"]
