[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tenant-shield-datahub"
version = "0.1.0"
description = "DataHub client for Tenant Shield — reads metadata (datasets, schemas, lineage) via GraphQL + MCP, generates tests, and writes results back."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Tenant Shield" }]
dependencies = [
    "httpx>=0.26.0",
    "tenant-shield-schema",
    "tenant-shield-utils",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0.0"]
dev = ["pytest>=7.4", "pytest-cov>=4.0"]

[tool.setuptools.packages.find]
where = ["src"]
