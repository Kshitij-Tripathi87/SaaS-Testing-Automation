[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tenant-shield-utils"
version = "0.2.0"
description = "Shared utilities for the Tenant Shield platform — logging, config loading, and auth helpers."
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Tenant Shield" }]
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]
