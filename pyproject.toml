[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tenant-shield"
version = "0.1.0"
description = "Multi-tenant isolation testing framework for B2B SaaS, with SOC 2 evidence reporting."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Tenant Shield" }]
keywords = [
    "multi-tenant",
    "saas",
    "security",
    "tenant-isolation",
    "soc2",
    "testing",
    "playwright",
    "pytest",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Security",
]
dependencies = [
    "pytest>=7.4.0",
    "pytest-timeout>=2.1.0",
    "pytest-xdist>=3.3.0",
    "pytest-rerunfailures>=12.0",
    "playwright>=1.40.0",
    "requests>=2.31.0",
    "tenacity>=8.2.0",
    "pyyaml>=6.0",
    "factory-boy>=3.3.0",
    "allure-pytest>=2.13.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
report = ["weasyprint>=60.0"]
dev = [
    "build>=1.0",
    "twine>=4.0",
]

[project.scripts]
tenant-shield = "tenant_shield.cli:main"

[project.entry-points.pytest11]
tenant_shield = "tenant_shield.reporting.plugin"

[project.urls]
Homepage = "https://tenantshield.dev"
Repository = "https://github.com/yourorg/tenant-shield"

[tool.setuptools.packages.find]
where = ["."]
include = ["tenant_shield*", "tests*", "data*"]
exclude = ["reports*", "build*", "dist*"]

[tool.setuptools.package-data]
tenant_shield = ["reporting/templates/*.html", "reporting/templates/*.j2", "config/environments/*.yaml"]
